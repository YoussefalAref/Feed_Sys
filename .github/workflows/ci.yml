name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-secret-change-me
      JWT_ACCESS_EXPIRE_MINUTES: 60
      VITE_API_BASE_URL: /api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start backend API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/
          curl -fsS http://127.0.0.1:8000/products
          curl -fsS http://127.0.0.1:8000/dashboard/stats

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > frontend.log 2>&1 &
          echo $! > frontend.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Frontend is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/
          curl -fsS http://127.0.0.1:4173/api/products

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/backend.log

      - name: Upload frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: frontend/frontend.log